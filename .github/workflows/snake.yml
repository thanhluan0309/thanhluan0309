name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # chạy 12 tiếng/lần
  workflow_dispatch:         # cho phép bấm chạy tay
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f78da7&color_dots=#1a1b27,#3b2f5c,#6d4fa8,#a78bfa,#f78da7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
